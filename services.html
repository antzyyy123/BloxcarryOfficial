<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Services | Blox Fruits Services</title>
  <meta name="description" content="Blox Fruits carries and help.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <div id="site-nav"></div>
  <main>
    <section class="page-head"><h1>Our <span>Services</span></h1><p>Choose a category, then pick a service to see the payment.</p></section>
    <section class="container block" style="padding-top:30px">
      <div class="pay-note"><i class="bi bi-cash-coin"></i> Pay in <b>Peso (₱)</b> or the <b>fruits</b> listed on each service</div>
      <div class="pay-note" style="background:rgba(72,199,142,.08);border-color:rgba(72,199,142,.3);color:#9be8c3"><i class="bi bi-shield-check"></i> Legit in-game help only. I don't use exploits or cheats for services.</div>
      <div class="row g-4" id="catGrid"></div>
    </section>

    <!-- Category modal: pick a service, payment shows below -->
    <div class="modal fade" id="catModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content custom-modal">
          <div class="modal-header"><h5 class="modal-title" id="catTitle"></h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
          <div class="modal-body">
            <p class="svc-hint">Choose a service to see the payment.</p>
            <div id="svcList"></div>
            <div id="payPanel" class="pay-panel" hidden></div>
          </div>
        </div>
      </div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="sheet.js"></script>
  <script src="main.js"></script>
  <script>
    let DATA = {};
    const CAT = { 'Raid Services': ['raids', 'bi-lightning-charge-fill'], 'Quest Services': ['quests', 'bi-map-fill'], 'Item Services': ['items', 'bi-box-seam-fill'], 'V4 Services': ['v4', 'bi-stars'], 'Race Services': ['races', 'bi-speedometer2'], 'Island Services': ['islands', 'bi-geo-alt-fill'] };
    function group(rows) { // sheet rows -> same shape the page already used
      const d = {};
      rows.forEach(r => {
        const [id, ic] = CAT[r.category] || [String(r.category).toLowerCase().replace(/\W+/g, '-'), 'bi-controller'];
        (d[id] = d[id] || { t: r.category, ic, items: [] }).items.push({ n: r.service, p: r.price, f: r.fruits || null, note: r.note || null, badge: r.status && r.status !== 'Active' ? r.status : null });
      });
      return d;
    }

    const grid = document.getElementById('catGrid'), list = document.getElementById('svcList'),
          panel = document.getElementById('payPanel'), title = document.getElementById('catTitle');
    let current = null;

    function renderGrid() { grid.innerHTML = Object.entries(DATA).map(([id, c]) => `
      <div class="col-sm-6 col-lg-4">
        <button class="cat-card" data-cat="${id}">
          <i class="bi ${c.ic} cat-ic"></i>
          <h3>${c.t}</h3>
          <span class="cat-count">${c.items.length} service${c.items.length > 1 ? 's' : ''}</span>
          <span class="cat-go">View services <i class="bi bi-arrow-right"></i></span>
        </button>
      </div>`).join(''); }

    function openCat(id) {
      const c = DATA[id]; if (!c) return;
      current = id;
      title.innerHTML = `<i class="bi ${c.ic}"></i> ${c.t}`;
      list.innerHTML = c.items.map((s, i) => `<button class="svc-pick" data-i="${i}"><span>${s.n}${s.badge ? `<span class="svc-badge">${s.badge}</span>` : ''}</span><i class="bi bi-chevron-right"></i></button>`).join('');
      panel.hidden = true;
      bootstrap.Modal.getOrCreateInstance(document.getElementById('catModal')).show();
    }

    function showPay(i) {
      const s = DATA[current].items[i];
      list.querySelectorAll('.svc-pick').forEach((b, k) => b.classList.toggle('active', k === i));
      panel.innerHTML = `
        <h4>${s.n}</h4>
        <div class="svc-price">₱${s.p}</div>
        ${s.f ? `<div class="svc-or">or pay with: <span>${s.f}</span></div>` : '<div class="svc-or"></div>'}
        ${s.note ? `<div class="svc-fee"><i class="bi bi-info-circle"></i> ${s.note}</div>` : ''}
        ${s.badge ? `<div class="svc-fee"><i class="bi bi-hourglass-split"></i> ${s.badge}</div>` : ''}
        <a href="contact.html" class="btn-custom"><i class="bi bi-chat-dots-fill"></i> Contact to Order</a>`;
      panel.hidden = false;
      panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    grid.addEventListener('click', e => { const b = e.target.closest('.cat-card'); if (b) openCat(b.dataset.cat); });
    list.addEventListener('click', e => { const b = e.target.closest('.svc-pick'); if (b) showPay(+b.dataset.i); });

    // links like services.html#quests open that category directly
    grid.innerHTML = '<p class="text-center" style="color:#9db9c2">Loading services…</p>';
    SheetAPI.services().then(rows => {
      if (!rows) { grid.innerHTML = '<p class="text-center" style="color:#ff9a9a">Services could not load. Please refresh or contact me on Discord.</p>'; return; }
      DATA = group(rows); renderGrid();
      const h = location.hash.slice(1); if (DATA[h]) openCat(h);
    });
  </script>
</body>
</html>
