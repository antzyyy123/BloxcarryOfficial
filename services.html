<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Services | Blox Fruits Services</title>
  <meta name="description" content="Blox Fruits carries and help.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <div id="site-nav"></div>
  <main>
    <section class="page-head"><h1>Our <span>Services</span></h1><p>Choose a category, then pick a service to see the payment.</p></section>
    <section class="container block" style="padding-top:30px">
      <div class="pay-note"><i class="bi bi-cash-coin"></i> Pay in <b>Peso (₱)</b> or the <b>fruits</b> listed on each service</div>
      <div class="pay-note" style="background:rgba(72,199,142,.08);border-color:rgba(72,199,142,.3);color:#9be8c3"><i class="bi bi-shield-check"></i> Legit in-game help only. I don't use exploits or cheats for services.</div>
      <div class="row g-4" id="catGrid"></div>
    </section>

    <!-- Category modal: pick a service, payment shows below -->
    <div class="modal fade" id="catModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content custom-modal">
          <div class="modal-header"><h5 class="modal-title" id="catTitle"></h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
          <div class="modal-body">
            <p class="svc-hint">Choose a service to see the payment.</p>
            <div id="svcList"></div>
            <div id="payPanel" class="pay-panel" hidden></div>
          </div>
        </div>
      </div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="main.js"></script>
  <script>
    const DATA = {"raids": {"t": "Raid Services", "ic": "bi-lightning-charge-fill", "items": [{"n": "Normal Raid (Full Awaken)", "p": 50, "f": "Buddha, Portal, or Lightning", "note": null, "badge": null}, {"n": "Special Raid (Full Awaken)", "p": 80, "f": "Any mythical fruit (except Mammoth, Shadow, Spirit)", "note": null, "badge": "Coming soon"}]}, "quests": {"t": "Quest Services", "ic": "bi-map-fill", "items": [{"n": "CDK Quest", "p": 150, "f": "Any mythical fruit", "note": null, "badge": null}, {"n": "TTK Quest", "p": 150, "f": "Any mythical fruit", "note": null, "badge": null}, {"n": "Yama Quest", "p": 75, "f": "Any legendary fruit", "note": null, "badge": null}, {"n": "Tushita Quest", "p": 75, "f": "Any legendary fruit", "note": null, "badge": null}, {"n": "Shark Anchor Quest", "p": 130, "f": "Any mythical fruit (except Mammoth, Shadow, Spirit)", "note": null, "badge": null}, {"n": "Dragonstorm Quest", "p": 140, "f": "Any mythical fruit (except Mammoth, Shadow, Spirit)", "note": null, "badge": null}, {"n": "Dojo Belt Quest", "p": 150, "f": "Any mythical fruit (except Mammoth, Shadow, Spirit)", "note": null, "badge": null}]}, "items": {"t": "Item Services", "ic": "bi-box-seam-fill", "items": [{"n": "Hollow Essence", "p": 40, "f": "Buddha, Portal, or Lightning", "note": null, "badge": null}, {"n": "God's Chalice", "p": 40, "f": "Buddha, Portal, or Lightning", "note": null, "badge": null}, {"n": "Fist of Darkness", "p": 40, "f": "Buddha, Portal, or Lightning", "note": null, "badge": null}, {"n": "Dark Fragment", "p": 40, "f": "Buddha, Portal, or Lightning", "note": null, "badge": null}, {"n": "Mirror Fractal", "p": 40, "f": "Buddha, Portal, or Lightning", "note": null, "badge": null}, {"n": "Blue Gear", "p": 50, "f": "Buddha, Portal, or Lightning", "note": null, "badge": null}, {"n": "Dragon Egg", "p": 60, "f": "Buddha, Portal, or Lightning", "note": null, "badge": null}, {"n": "Leviathan Heart", "p": 180, "f": "Any mythical fruit (except Mammoth, Shadow, Spirit)", "note": null, "badge": null}]}, "v4": {"t": "V4 Services", "ic": "bi-stars", "items": [{"n": "Full Gear", "p": 160, "f": "Any mythical fruit (except Mammoth, Shadow, Spirit)", "note": "Training fee: ₱40", "badge": null}, {"n": "1 Trial", "p": 40, "f": "Buddha, Portal, or Lightning", "note": "Training fee: ₱10", "badge": null}, {"n": "2 Trials", "p": 80, "f": "Buddha, Portal, or Lightning", "note": "Training fee: ₱20", "badge": null}, {"n": "3 Trials", "p": 120, "f": "Any mythical fruit (except Mammoth, Shadow, Spirit)", "note": "Training fee: ₱30", "badge": null}]}, "races": {"t": "Race Services", "ic": "bi-speedometer2", "items": [{"n": "Cyborg Race", "p": 80, "f": null, "note": null, "badge": null}, {"n": "Ghoul Race", "p": 70, "f": null, "note": null, "badge": null}, {"n": "Draco Race", "p": 90, "f": null, "note": null, "badge": null}, {"n": "Race V2", "p": 30, "f": null, "note": null, "badge": null}, {"n": "Race V3", "p": 50, "f": null, "note": null, "badge": null}]}, "islands": {"t": "Island Services", "ic": "bi-geo-alt-fill", "items": [{"n": "Kitsune Island", "p": 60, "f": "Buddha, Portal, or Lightning", "note": null, "badge": null}, {"n": "Prehistoric Island", "p": 70, "f": "Buddha, Portal, or Lightning", "note": null, "badge": null}]}};

    const grid = document.getElementById('catGrid'), list = document.getElementById('svcList'),
          panel = document.getElementById('payPanel'), title = document.getElementById('catTitle');
    let current = null;

    grid.innerHTML = Object.entries(DATA).map(([id, c]) => `
      <div class="col-sm-6 col-lg-4">
        <button class="cat-card" data-cat="${id}">
          <i class="bi ${c.ic} cat-ic"></i>
          <h3>${c.t}</h3>
          <span class="cat-count">${c.items.length} service${c.items.length > 1 ? 's' : ''}</span>
          <span class="cat-go">View services <i class="bi bi-arrow-right"></i></span>
        </button>
      </div>`).join('');

    function openCat(id) {
      const c = DATA[id]; if (!c) return;
      current = id;
      title.innerHTML = `<i class="bi ${c.ic}"></i> ${c.t}`;
      list.innerHTML = c.items.map((s, i) => `<button class="svc-pick" data-i="${i}"><span>${s.n}${s.badge ? `<span class="svc-badge">${s.badge}</span>` : ''}</span><i class="bi bi-chevron-right"></i></button>`).join('');
      panel.hidden = true;
      bootstrap.Modal.getOrCreateInstance(document.getElementById('catModal')).show();
    }

    function showPay(i) {
      const s = DATA[current].items[i];
      list.querySelectorAll('.svc-pick').forEach((b, k) => b.classList.toggle('active', k === i));
      panel.innerHTML = `
        <h4>${s.n}</h4>
        <div class="svc-price">₱${s.p}</div>
        ${s.f ? `<div class="svc-or">or pay with: <span>${s.f}</span></div>` : '<div class="svc-or"></div>'}
        ${s.note ? `<div class="svc-fee"><i class="bi bi-info-circle"></i> ${s.note}</div>` : ''}
        ${s.badge ? `<div class="svc-fee"><i class="bi bi-hourglass-split"></i> ${s.badge}</div>` : ''}
        <a href="contact.html" class="btn-custom"><i class="bi bi-chat-dots-fill"></i> Contact to Order</a>`;
      panel.hidden = false;
      panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    grid.addEventListener('click', e => { const b = e.target.closest('.cat-card'); if (b) openCat(b.dataset.cat); });
    list.addEventListener('click', e => { const b = e.target.closest('.svc-pick'); if (b) showPay(+b.dataset.i); });

    // links like services.html#quests open that category directly
    const h = location.hash.slice(1);
    if (DATA[h]) openCat(h);
  </script>
</body>
</html>
