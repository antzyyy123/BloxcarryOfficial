<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Blox Fruits Services</title>
  <meta name="description" content="Contact us on Discord or Messenger.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <div id="site-nav"></div>
  <main>
    <section class="page-head"><h1>Contact <span>Me</span></h1><p>Message me on Discord or Messenger to order. Payment in peso or fruits.</p></section>
    <section class="container block" style="padding-top:30px">
      <div class="row g-4 justify-content-center">
        <div class="col-md-6 col-lg-5"><a class="contact-big cb-discord" data-link="discord"><i class="bi bi-discord"></i><span>Discord<small>Chat with me on Discord</small></span></a></div>
        <div class="col-md-6 col-lg-5"><a class="contact-big cb-messenger" data-link="messenger"><i class="bi bi-messenger"></i><span>Messenger<small>Chat with me on Messenger</small></span></a></div>
      </div>
      <div class="social-row mt-5">
        <a class="social-circle" data-link="discord" aria-label="Discord"><i class="bi bi-discord"></i></a>
        <a class="social-circle" data-link="facebook" aria-label="Facebook"><i class="bi bi-facebook"></i></a>
        <a class="social-circle" data-link="tiktok" aria-label="TikTok"><i class="bi bi-tiktok"></i></a>
        <a class="social-circle" data-link="email" aria-label="Email"><i class="bi bi-envelope-fill"></i></a>
      </div>
      <p class="text-center mt-4" style="color:#ffc107;font-size:.88rem"><i class="bi bi-exclamation-triangle"></i> Never share your Roblox password. I will never ask for it.</p>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="main.js"></script>
</body>
</html>
